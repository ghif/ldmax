# Test configuration for quick CelebA Latent DiT verification.
dataset: "celeba"

model:
  input_size: 32      # Latent space resolution (256/8)
  patch_size: 2
  in_channels: 4      # Number of VAE latent channels
  hidden_size: 128
  depth: 2
  num_heads: 2
  num_classes: 40     # Number of CelebA binary attributes
  label_mode: "attributes"
  label_dim: 40
  learn_sigma: false

training:
  learning_rate: 0.0001
  weight_decay: 0.01
  batch_size: 4
  total_steps: 2
  seed: 42
  ema_decay: 0.999
  use_bf16: false
  prefetch_size: 1

data:
  image_size: 256     # Resolution for CelebA loader (center cropped)
  dataset_name: "gs://diffjax/datasets/celeba"

evaluation:
  log_interval: 1
  checkpoint_interval: 1
  sampling_interval: 1
  sample_count: 4
  num_inference_steps: 2
  cfg_scale: 4.0
