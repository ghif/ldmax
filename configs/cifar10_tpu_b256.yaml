dataset: "cifar10"

model:
  type: "dit"
  use_vae: false
  input_size: 32      # Pixel space resolution (native)
  patch_size: 2
  in_channels: 3      # RGB channels
  hidden_size: 128
  depth: 4
  num_heads: 4
  num_classes: 10
  learn_sigma: false

training:
  learning_rate: 0.0001
  weight_decay: 0.01
  batch_size: 256
  total_steps: 100000
  seed: 42
  ema_decay: 0.999
  mixed_precision: true

data:
  image_size: 32      # Use native CIFAR-10 resolution

evaluation:
  log_interval: 100
  checkpoint_interval: 5000
  sampling_interval: 1000
  sample_count: 16
