# Latent VAE Diffusion Transformer (DiT) configuration for CelebA.
dataset: "celeba"

model:
  input_size: 32      # Latent space resolution (256/8)
  patch_size: 2
  in_channels: 4      # Number of VAE latent channels
  hidden_size: 384
  depth: 12
  num_heads: 6
  num_classes: 40     # Number of CelebA binary attributes
  label_mode: "attributes"
  label_dim: 40
  learn_sigma: false

training:
  learning_rate: 0.0002
  weight_decay: 0.01
  batch_size: 128
  total_steps: 500000
  seed: 42
  ema_decay: 0.9999
  use_bf16: true
  prefetch_size: 2

data:
  image_size: 256     # Resolution for CelebA loader (center cropped)
  dataset_name: "flwrlabs/celeba"
  dataset_config: "img_align+identity+attr"

evaluation:
  log_interval: 200
  checkpoint_interval: 10000
  sampling_interval: 2000
  sample_count: 16
  num_inference_steps: 50
  cfg_scale: 4.0
