dataset: "cifar10"

model:
  input_size: 16      # Latent space resolution (128/8)
  patch_size: 2
  in_channels: 4      # Number of VAE latent channels
  hidden_size: 128
  depth: 2
  num_heads: 2
  num_classes: 10

training:
  learning_rate: 0.0001
  weight_decay: 0.01
  batch_size: 4
  total_steps: 2
  seed: 42
  ema_decay: 0.999
  mixed_precision: true

data:
  image_size: 128     # Resize CIFAR-10 images for 16x16 latent space

evaluation:
  log_interval: 1
  checkpoint_interval: 1
  sampling_interval: 1
