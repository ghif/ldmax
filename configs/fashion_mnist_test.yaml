dataset: "fashion_mnist"

model:
  input_size: 28
  patch_size: 2
  in_channels: 1
  hidden_size: 32
  depth: 1
  num_heads: 2
  num_classes: 10

training:
  learning_rate: 0.0002
  weight_decay: 0.01
  batch_size: 2
  total_steps: 2
  seed: 42
  ema_decay: 0.999

data:
  dataset_name: "zalando-datasets/fashion_mnist"

evaluation:
  log_interval: 1
  checkpoint_interval: 1
  sampling_interval: 1
  sample_count: 2
  num_inference_steps: 2
  cfg_scale: 1.0
