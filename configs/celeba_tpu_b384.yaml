dataset: "celeba"

model:
  input_size: 32
  patch_size: 2
  in_channels: 4
  hidden_size: 384
  depth: 12
  num_heads: 6
  num_classes: 40
  label_mode: "attributes"
  label_dim: 40

training:
  learning_rate: 0.0006
  weight_decay: 0.01
  batch_size: 384
  total_steps: 500000
  seed: 42
  ema_decay: 0.9999
  mixed_precision: true

data:
  image_size: 256
  dataset_name: "flwrlabs/celeba"
  dataset_config: "img_align+identity+attr"

evaluation:
  log_interval: 200
  checkpoint_interval: 10000
  sampling_interval: 2000
  sample_count: 16
