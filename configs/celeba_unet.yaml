dataset: "celeba"

model:
  type: "unet"
  input_size: 32
  in_channels: 4
  out_channels: 4
  model_channels: 128
  attention_resolutions: [4, 2, 1]
  num_res_blocks: 2
  channel_mult: [1, 2, 2, 2]
  num_heads: 8
  transformer_depth: 1
  context_dim: 128 # For attribute conditioning
  num_classes: 40
  label_mode: "attributes"
  label_dim: 40

training:
  learning_rate: 0.0001
  weight_decay: 0.01
  batch_size: 256
  total_steps: 500000
  seed: 42
  ema_decay: 0.9999
  mixed_precision: true

data:
  image_size: 256
  dataset_name: "flwrlabs/celeba"
  dataset_config: "img_align+identity+attr"

evaluation:
  log_interval: 200
  checkpoint_interval: 10000
  sampling_interval: 2000
  sample_count: 16
