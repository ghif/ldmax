dataset: "celeba"

model:
  input_size: 32      # Latent space resolution (256/8)
  patch_size: 2
  in_channels: 4      # Number of VAE latent channels
  hidden_size: 384
  depth: 12
  num_heads: 6
  num_classes: 1      # CelebA loader currently returns dummy label 0

training:
  learning_rate: 0.0001
  weight_decay: 0.01
  batch_size: 32
  total_steps: 500000
  seed: 42
  ema_decay: 0.9999
  mixed_precision: true

data:
  image_size: 256     # Resolution for CelebA loader (center cropped)

evaluation:
  log_interval: 100
  checkpoint_interval: 10000
  sampling_interval: 5000
